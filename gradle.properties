kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# This fork has its own application ID and no Firebase project configuration.
# Enable only after supplying matching google-services.json clients.
include-telemetry=false
