name: Native Physical v4.0 Verification
on:
  push:
    branches: [main, native-physical-v40]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-physical-v40
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Pin one signing identity for the entire build
        env:
          NATIVE_KEYSTORE: ${{ secrets.MIHON_NATIVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          keyfile="$RUNNER_TEMP/native-reader.keystore"
          if [ -n "$NATIVE_KEYSTORE" ]; then
            printf '%s' "$NATIVE_KEYSTORE" | base64 --decode > "$keyfile"
          else
            keytool -genkeypair -keystore "$keyfile" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Mihon Physical,C=US"
          fi
          chmod 600 "$keyfile"
          printf '%s\n' "storeFile=$keyfile" "storePassword=android" "keyAlias=androiddebugkey" "keyPassword=android" > keystore.properties
      - name: Format native sources
        run: |
          ./gradlew spotlessApply
          git diff --binary > native-format.patch
          echo NATIVE_FORMAT_BEGIN
          cat native-format.patch
          echo NATIVE_FORMAT_END
      - name: Fetch licensed comic pages for instrumentation only
        run: |
          mkdir -p app/src/androidTest/assets/real_comic
          for page in 1 2 3; do
            curl --fail --location --retry 3 --max-time 90 "https://www.peppercarrot.com/0_sources/ep01_Potion-of-Flight/low-res/en_Pepper-and-Carrot_by-David-Revoy_E01P0${page}.jpg" -o "app/src/androidTest/assets/real_comic/page${page}.jpg"
          done
      - name: Test approved mesh and build native APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Release build daemon memory
        run: ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual ReaderActivity on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/native-reader-smoke.sh
      - name: Check final APK signing identity
        id: signing_identity
        if: always()
        run: |
          set -o pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          expected=$(keytool -exportcert -alias androiddebugkey -keystore "$RUNNER_TEMP/native-reader.keystore" -storepass android | sha256sum | cut -d' ' -f1)
          echo "Retained signing certificate SHA256=$expected"
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$signer" verify --print-certs "$apk" | tee apk-certificates.txt
            actual=$(sed -n 's/.*certificate SHA-256 digest: //p' apk-certificates.txt | head -n1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            echo "APK $(basename "$apk") certificate SHA256=$actual"
            test "$actual" = "$expected"
          done
      - name: Preserve signing key for private recovery
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/native-reader.keystore" ]; then exit 0; fi
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/native-reader.keystore" -outform DER -out native-signing-key.encrypted .github/native-recovery-public.pem
          echo NATIVE_SIGNING_RECOVERY_BEGIN
          base64 -w76 native-signing-key.encrypted
          echo NATIVE_SIGNING_RECOVERY_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-native-signing-key
          path: native-signing-key.encrypted
          if-no-files-found: warn
      - name: Record visual proof
        if: always()
        run: |
          for image in $(find app/build/native-proof -type f -name '*.jpg' 2>/dev/null); do
            echo NATIVE_IMAGE_BEGIN $(basename "$image")
            base64 -w76 "$image"
            echo NATIVE_IMAGE_END
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.signing_identity.outcome == 'success'
        with:
          name: mihon-native-v40-apk
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v40-verification
          path: |
            app/build/native-proof
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/androidTests
            native-format.patch
          if-no-files-found: warn
