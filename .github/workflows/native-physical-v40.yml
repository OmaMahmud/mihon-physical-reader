name: Native Physical v4.0 Verification
on:
  push:
    branches: [main, native-physical-v40]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-physical-v40
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore persistent signing identity when configured
        env:
          NATIVE_KEYSTORE: ${{ secrets.MIHON_NATIVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NATIVE_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$NATIVE_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Format native sources
        run: |
          ./gradlew spotlessApply
          git diff --binary > native-format.patch
          echo NATIVE_FORMAT_BEGIN
          cat native-format.patch
          echo NATIVE_FORMAT_END
      - name: Fetch licensed comic pages for instrumentation only
        run: |
          mkdir -p app/src/androidTest/assets/real_comic
          for page in 1 2 3; do
            curl --fail --location --retry 3 --max-time 90 "https://www.peppercarrot.com/0_sources/ep01_Potion-of-Flight/low-res/en_Pepper-and-Carrot_by-David-Revoy_E01P0${page}.jpg" -o "app/src/androidTest/assets/real_comic/page${page}.jpg"
          done
      - name: Test approved mesh and build native APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Preserve signing key for private recovery
        run: |
          openssl cms -encrypt -binary -aes256 -in "$HOME/.android/debug.keystore" -outform DER -out native-signing-key.encrypted .github/native-recovery-public.pem
          echo NATIVE_SIGNING_RECOVERY_BEGIN
          base64 -w76 native-signing-key.encrypted
          echo NATIVE_SIGNING_RECOVERY_END
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-native-signing-key
          path: native-signing-key.encrypted
      - name: Release build daemon memory
        run: ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual ReaderActivity on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/native-reader-smoke.sh
      - name: Record visual proof
        if: always()
        run: |
          for image in $(find app/build/native-proof -type f -name '*.jpg' 2>/dev/null); do
            echo NATIVE_IMAGE_BEGIN $(basename "$image")
            base64 -w76 "$image"
            echo NATIVE_IMAGE_END
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mihon-native-v40-apk
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v40-verification
          path: |
            app/build/native-proof
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/androidTests
            native-format.patch
          if-no-files-found: warn
