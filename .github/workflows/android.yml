name: Real Reader Android
on:
  push:
    branches: [real-reader-independent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch licensed comic fixture for tests only
        run: |
          mkdir -p app/src/androidTest/assets/comic
          for page in 1 2 3; do
            curl --fail --location --retry 3 --max-time 90 "https://www.peppercarrot.com/0_sources/ep01_Potion-of-Flight/low-res/en_Pepper-and-Carrot_by-David-Revoy_E01P0${page}.jpg" -o "app/src/androidTest/assets/comic/page${page}.jpg"
          done
      - name: Build, unit test and lint
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Real-Reader-debug-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/real-reader-proof app/build/proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real-Reader-verification
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/proof
